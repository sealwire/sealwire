[package]
name = "relay-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Build with the private crate linked in.
private = ["dep:sealwire-private"]

[dependencies]
aes-gcm.workspace = true
async-trait = "0.1"
axum.workspace = true
claude-code-client-sdk = "0.1"
base64.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
hkdf.workspace = true
hmac.workspace = true
libc.workspace = true
p256.workspace = true
qrcode.workspace = true
rand.workspace = true
reqwest.workspace = true
relay-api = { path = "../relay-api" }
relay-broker = { path = "../relay-broker" }
# PRIVATE and optional. Without it the relay builds, runs, and is fully
# auditable — it simply has no orchestration engines registered. Switch the
# `path` for a `git` source once the private repo has a remote.
sealwire-private = { path = "../sealwire-private", optional = true }
relay-http = { path = "../relay-http" }
relay-util = { path = "../relay-util" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
crypto_secretbox.workspace = true
fs4 = "1.1.0"
rpassword = "7.3"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
# `test-util` gives tests a paused clock, so the broker writer's pacing/priority rules
# are asserted deterministically instead of by sleeping in real time.
tokio = { workspace = true, features = ["test-util"] }
# `oneshot` for router-level tests (already in the lock via axum/tower-http).
tower = { version = "0.5", features = ["util"] }
