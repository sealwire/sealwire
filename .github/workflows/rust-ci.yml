name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  frontend:
    name: npm-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

  lint:
    name: eslint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: npm ci
        run: npm ci

      # Static `no-undef` guard: catches free/undefined identifiers (e.g. a stray
      # `session` reference) that `vite build` happily emits and only throw at
      # runtime.
      - name: npm run lint
        run: npm run lint

  # Prices are VENDORED (crates/relay-server/src/usage/model-prices.json, compiled
  # in with include_str!), so a released binary carries whatever the table said
  # when it was built and a user running `npx sealwire` never refreshes it. The
  # build must not reach the network to fix that — an offline or rate-limited
  # build producing different prices than an online one is worse than stale
  # prices — so the reminder lives here instead, on the nightly run only.
  #
  # Failing this job does NOT mean the tree is broken. It means upstream list
  # prices moved and the snapshot is due a refresh:
  #     node scripts/update-model-prices.mjs   (then commit the result)
  model-prices:
    name: model-prices-freshness
    # Nightly and manual only. On a PR this would fail for a reason the PR did
    # not cause, which is how a red check stops being read.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Compare vendored prices against upstream
        run: node scripts/update-model-prices.mjs --check

  rust:
    name: fmt-check-test
    runs-on: ubuntu-latest

    # Job level, not step level: a step's own `if` is evaluated before its `env`
    # block exists, so guarding on the secret only works from here.
    env:
      PRIVATE_APP_CLIENT_ID: ${{ secrets.RELAY_PRIVATE_APP_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The claude bridge<->fake-worker integration tests spawn `node`; without a
      # guaranteed Node they would skip silently instead of running.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

      # The public checkout has only the stub, so the task-team suite is compiled
      # out above. Pull the private crate in and run the SAME suite against the
      # code that actually ships — otherwise the 42 team tests would never run
      # anywhere, and a change to the public driver could break them with CI still
      # green.
      #
      # Forks and Dependabot get no secret, so this step is skipped there rather
      # than failing: the job above still covers everything outside the private
      # crate. NOT on `pull_request`. This step hands a key that reads the
      # proprietary sources to the workflow, and a pull request is the one trigger
      # whose contents someone other than a maintainer can influence. Fork PRs get
      # no secrets from GitHub at all, but a PR from a branch in this repo would —
      # so the moment anyone else has write access, a PR could print the private
      # crate into a public build log. Push, schedule and manual runs cover the
      # same code a moment later, which is the cheaper side of the trade.
      #
      # `continue-on-error` on both private steps, and it is load-bearing rather
      # than defensive. The `if:` above only covers credentials that are ABSENT.
      # Credentials that are present but cannot mint — the app not installed on
      # the private repository, a rotated key, an org policy — fail the step, and
      # a failed step fails the job: a configuration fault would take `cargo
      # fmt`, `cargo check` and the whole public suite red with it, reporting
      # itself as if the code were broken. It is also what makes the gates below
      # mean anything: `steps.<id>.outcome` is by definition the result BEFORE
      # continue-on-error is applied, so an `outcome == 'success'` gate is only
      # reachable on a step allowed to fail. Without these two lines the gates
      # read as a graceful skip and behave as a hard stop.
      - name: Mint a private-crate token
        id: private-token
        if: env.PRIVATE_APP_CLIENT_ID != '' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELAY_PRIVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELAY_PRIVATE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: sealwire-private

      - name: Checkout private crate
        id: private
        if: steps.private-token.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: sealwire/sealwire-private
          token: ${{ steps.private-token.outputs.token }}
          path: .private

      # The price of the skip above is that the team suite runs nowhere and the
      # tick is still green, which is indistinguishable from a healthy build
      # unless the run says so. Only on the path where credentials were present
      # and did not work — on a fork the steps are skipped, not failed, and no
      # private coverage was ever expected there.
      - name: Warn that the private crate was skipped
        if: steps.private-token.outcome == 'failure' || steps.private.outcome == 'failure'
        run: echo "::warning::Could not read the private crate, so the task-team suite did not run. Read the failed step above — the mint step's inputs, the RELAY_PRIVATE_APP_* secrets, or the app's installation on sealwire-private."

      - name: cargo test (with private crate)
        if: steps.private.outcome == 'success'
        env:
          RELAY_PRIVATE_PATH: ${{ github.workspace }}/.private
        run: scripts/with-private.sh cargo test --workspace --features relay-server/private

  review-recap-modes-e2e:
    name: relay-http-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Job level so a step's `if` can read it — a step's own `env` is not in scope
    # for its own condition.
    env:
      PRIVATE_APP_CLIENT_ID: ${{ secrets.RELAY_PRIVATE_APP_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      - name: Build relay-server
        run: cargo build -p relay-server

      # Full-stack HTTP e2e (no browser / Playwright): spins up the real relay
      # binary with the fake provider and drives BOTH review briefing modes
      # through /api/session/review — `recap` (drives a recap turn) and
      # `last_message` (skips it, briefs with the author's last message) — asserting
      # the recap turn's presence/absence and the reviewer's briefing source.
      # `continue-on-error` + a gate at the end of the job, so one failing e2e does
      # not hide the others. These three drive separate surfaces and share nothing
      # but the relay binary; stopping at the first meant each red CI round named
      # exactly one of them. The job still fails — see "Fail if any e2e failed".
      - name: Review recap-modes e2e
        id: e2e_recap
        continue-on-error: true
        run: npm run test:review-recap-modes

      # Session workspace identity over HTTP: birth in a linked worktree must keep
      # Changes + review on that tree, and pin/unpin must move Diff without a browser.
      - name: Cwd-drift worktree e2e
        id: e2e_cwd_drift
        if: always()
        continue-on-error: true
        run: CWD_DRIFT_E2E_SKIP_BUILD=1 npm run test:cwd-drift

      # Same shape for the Task team: the real relay binary, the fake provider, a
      # real git repository. It covers the layer the in-process Rust tests cannot
      # reach — HTTP routes, provisioning, and the branch left on disk — and it has
      # already caught two defects that only exist there.
      # Needs the real private crate: against the public stub the suite skips
      # itself, which would be a green tick asserting nothing. NOT on
      # `pull_request` — see the note on the same guard in the `rust` job.
      #
      # Both tolerate failure — see the note on the same pair in the `rust` job:
      # without it a credential fault fails the job outright and the
      # `outcome`-gated steps below never run to notice.
      - name: Mint a private-crate token
        id: private-token
        if: env.PRIVATE_APP_CLIENT_ID != '' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELAY_PRIVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELAY_PRIVATE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: sealwire-private

      - name: Checkout private crate
        id: private
        if: steps.private-token.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: sealwire/sealwire-private
          token: ${{ steps.private-token.outputs.token }}
          path: .private

      # Worth more here than in the `rust` job: the fallback below still runs the
      # suite, against the public stub, where it skips itself — a green tick
      # asserting nothing unless the run admits which half it ran.
      - name: Warn that the private crate was skipped
        if: steps.private-token.outcome == 'failure' || steps.private.outcome == 'failure'
        run: echo "::warning::Could not read the private crate, so the task-team e2e ran against the public stub and skipped itself. Read the failed step above — the mint step's inputs, the RELAY_PRIVATE_APP_* secrets, or the app's installation on sealwire-private."

      - name: Task team e2e
        id: e2e_task_team
        if: always()
        continue-on-error: true
        env:
          RELAY_PRIVATE_PATH: ${{ github.workspace }}/.private
        run: |
          if [ "${{ steps.private.outcome }}" = "success" ]; then
            scripts/with-private.sh npm run test:private-frontend
            scripts/with-private.sh npm run test:task-team
          else
            npm run test:task-team
          fi

      # The job's verdict. Without this every e2e above is advisory, since
      # `continue-on-error` makes a failed step stop counting.
      - name: Fail if any e2e failed
        if: always()
        run: |
          failed=""
          [ "${{ steps.e2e_recap.outcome }}" = "failure" ] && failed="$failed review-recap-modes"
          [ "${{ steps.e2e_cwd_drift.outcome }}" = "failure" ] && failed="$failed cwd-drift"
          [ "${{ steps.e2e_task_team.outcome }}" = "failure" ] && failed="$failed task-team"
          if [ -n "$failed" ]; then
            echo "::error::relay-http-e2e failures:$failed"
            exit 1
          fi
          echo "all relay-http e2e scenarios passed"

  browser-smoke:
    name: browser-page-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      - name: Install Playwright
        run: npm run test:browser:install:ci

      - name: Build relay-server
        run: cargo build -p relay-server

      # Build the frontend, serve it through the relay, load every entry point in
      # a real browser, and fail on any uncaught error / CSP violation / root
      # that never mounts. This is the guard that catches render crashes
      # (e.g. `session is not defined`) which `vite build` does not.
      - name: Page smoke test
        run: npm run test:browser:smoke

  browser-e2e:
    name: browser-public-core-fake
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      - name: Install Playwright
        run: npm run test:browser:install:ci

      - name: Build relay binaries
        run: cargo build -p relay-broker -p relay-server

      - name: Public broker browser smoke
        run: npm run test:browser:public-core:fake

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-public-core-fake-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

  browser-local-core:
    name: browser-local-core-fake
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      - name: Install Playwright
        run: npm run test:browser:install:ci

      - name: Build relay binary
        run: cargo build -p relay-server

      - name: Local browser core fake matrix
        run: npm run test:browser:local-core:fake

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-local-core-fake-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

  browser-self-hosted:
    name: browser-self-hosted-pairing-fake
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      - name: Install Playwright
        run: npm run test:browser:install:ci

      - name: Build relay binaries
        run: cargo build -p relay-broker -p relay-server

      - name: Self-hosted pairing fake smoke
        run: npm run test:browser:pairing:fake

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-self-hosted-pairing-fake-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

  browser-local-full:
    name: browser-local-full-fake
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      - name: Install Playwright
        run: npm run test:browser:install:ci

      - name: Build relay binary
        run: cargo build -p relay-server

      - name: Local browser full fake matrix
        run: npm run test:browser:local-full:fake

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-local-full-fake-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

  browser-public-full:
    name: browser-public-full-fake
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      - name: Install Playwright
        run: npm run test:browser:install:ci

      - name: Build relay binaries
        run: cargo build -p relay-broker -p relay-server

      - name: Public browser full fake matrix
        run: npm run test:browser:public:fake

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-public-full-fake-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

