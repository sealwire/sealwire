  # excluded from the root cargo workspace (Cargo.toml `exclude = ["src-tauri"]`),
  # so `cargo check --workspace` never compiles it and nothing here guards the
  # desktop build. Re-enable (uncomment) when we start shipping the desktop app /
  # dmg — at that point decide the trigger (e.g. release tags or workflow_dispatch
  # rather than every push). Notes for whoever re-enables it:
