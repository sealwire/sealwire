name: npm Release

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build-binary:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            cargo_target: aarch64-apple-darwin
            executable: relay-server
          # Cross-compile the Intel binary on an Apple Silicon runner. macos-13
          # (Intel) runners are scarce and queue for a long time / are being
          # retired; Apple->Apple cross-compilation needs no extra linker, and
          # cc-built C deps (e.g. rusqlite bundled) pick up `-arch x86_64`
          # automatically from the target triple.
          - target: darwin-x64
            runner: macos-15
            cargo_target: x86_64-apple-darwin
            executable: relay-server
          # Every platform gets a prebuilt binary, because only a prebuilt binary
          # carries the private crate. The source fallback in the launcher builds
          # the public stub, so a platform missing from this matrix ships a relay
          # whose task teams refuse — and does it silently, at the moment a user
          # first tries to start one.
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            cargo_target: aarch64-unknown-linux-gnu
            executable: relay-server
          - target: linux-x64
            runner: ubuntu-latest
            cargo_target: x86_64-unknown-linux-gnu
            executable: relay-server
          - target: win32-x64
            runner: windows-latest
            cargo_target: x86_64-pc-windows-msvc
            executable: relay-server.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fail loudly when the private-crate app credentials are missing. A release
      # built without the private crate ships a relay whose task lists and task
      # teams refuse at runtime — from a green workflow run. Presence-only
      # booleans keep the raw App private key out of this job's environment;
      # `${{ secrets.X != '' }}` evaluates without materializing the value.
      - name: Require the private-crate app credentials
        shell: bash
        env:
          HAS_PRIVATE_APP_CLIENT_ID: ${{ secrets.RELAY_PRIVATE_APP_CLIENT_ID != '' }}
          HAS_PRIVATE_APP_KEY: ${{ secrets.RELAY_PRIVATE_APP_KEY != '' }}
        run: |
          if [ "${HAS_PRIVATE_APP_CLIENT_ID}" != "true" ] || [ "${HAS_PRIVATE_APP_KEY}" != "true" ]; then
            echo "::error::RELAY_PRIVATE_APP_CLIENT_ID / RELAY_PRIVATE_APP_KEY are not both set. A release built without the private crate ships a relay whose task lists and task teams refuse at runtime. See PRIVATE_CRATE.md."
            exit 1
          fi
          echo "private-crate app credentials present"

      # A GitHub App installation token rather than a deploy key: deploy keys are
      # disabled by organisation policy, and this expires in an hour, is revocable
      # on its own, and `repositories:` holds it to the one repository even though
      # the app could be installed on more later. `permission-contents: read`
      # narrows the minted token further (the App installation must itself grant
      # at most Contents: read — verify on the GitHub App settings).
      - name: Mint a private-crate token
        id: private-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELAY_PRIVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELAY_PRIVATE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: sealwire-private
          permission-contents: read

      - name: Checkout private crate
        uses: actions/checkout@v5
        with:
          repository: sealwire/sealwire-private
          token: ${{ steps.private-token.outputs.token }}
          path: .private
          persist-credentials: false

      # Drop the nested gitdir before npm/Cargo run. Even with persist-credentials
      # false, leaving `.private/.git` around is unnecessary attack surface for
      # later build scripts; remove it cross-platform via bash (Windows runners
      # included). Do not print git config or token values.
      - name: Drop private checkout credentials
        shell: bash
        run: rm -rf .private/.git

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.cargo_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      - name: Build embedded web assets
        shell: bash
        env:
          RELAY_PRIVATE_PATH: ${{ github.workspace }}/.private
        run: scripts/with-private.sh npm run build

      # `shell: bash` on every runner, not just the Unix ones: with-private.sh is
      # a bash script and the Windows runner defaults to pwsh, which would fail
      # to run it at all.
      #
      # `--profile release-npm` (workspace Cargo.toml) applies strip/fat LTO/
      # codegen-units=1/debug=0 for npm prebuilds only — ordinary
      # `cargo build --release` is unchanged. Path remapping keeps absolute
      # runner/workspace/private-checkout paths out of the binary metadata.
      - name: Configure rustc path remapping
        shell: bash
        env:
          RELAY_PRIVATE_PATH: ${{ github.workspace }}/.private
        run: node scripts/npm-release-remap-env.mjs --github-env

      - name: Build relay-server
        shell: bash
        env:
          RELAY_PRIVATE_PATH: ${{ github.workspace }}/.private
          # Belt-and-braces with OUT_DIR profile detection in build.rs — Cargo's
          # PROFILE env is only debug|release and cannot name release-npm.
          SEALWIRE_NPM_RELEASE: "1"
        run: scripts/with-private.sh cargo build --profile release-npm -p relay-server --target ${{ matrix.cargo_target }} --features private

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "dist-bin/${{ matrix.target }}"
          cp "target/${{ matrix.cargo_target }}/release-npm/${{ matrix.executable }}" "dist-bin/${{ matrix.target }}/${{ matrix.executable }}"

      # Byte-scan (+ optional nm/dumpbin) the exact staged executable before
      # upload. Upload path is the file alone — never a directory that could
      # include PDB/dSYM sidecars.
      - name: Verify staged binary
        shell: bash
        env:
          RELAY_PRIVATE_PATH: ${{ github.workspace }}/.private
        run: |
          node scripts/verify-npm-release-binary.mjs \
            "dist-bin/${{ matrix.target }}/${{ matrix.executable }}" \
            --workspace "${{ github.workspace }}" \
            --private "${{ github.workspace }}/.private"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: relay-server-${{ matrix.target }}
          path: dist-bin/${{ matrix.target }}/${{ matrix.executable }}
          if-no-files-found: error

  # A SEPARATE job from the build on purpose, and it must stay that way. The
  # package's `files` allow-list includes `crates/**` — for the launcher's
  # build-from-source fallback — and that allow-list beats .gitignore, so a pack
  # that runs while with-private.sh has the real sources swapped in uploads them
  # to npm, where a publish cannot be taken back. Merging these two jobs to skip
  # the artifact round-trip would put the private checkout and `npm publish` in
  # one workspace. This job checks out clean: the crate here is the stub, and the
  # engines ship only as compiled code inside the binaries it downloads.
  # `prepublishOnly` runs scripts/check-no-private.sh as the backstop.
  publish:
    name: publish-npm
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: relay-server-*
          path: bin
          merge-multiple: false

      - name: Move binaries into package layout
        shell: bash
        run: |
          set -euo pipefail
          for artifact_dir in bin/relay-server-*; do
            target="${artifact_dir#bin/relay-server-}"
            mkdir -p "bin/${target}"
            find "${artifact_dir}" -maxdepth 1 -type f -exec mv {} "bin/${target}/" \;
            rmdir "${artifact_dir}"
          done
          chmod +x bin/*/relay-server || true

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check version matches release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          pkg_version="$(npm pkg get version | tr -d '"')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag" ]; then
            echo "::error::package.json version ($pkg_version) does not match release tag ($tag)"
            exit 1
          fi
          echo "version $pkg_version matches release tag $tag"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
