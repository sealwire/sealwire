[package]
name = "sealwire-desktop"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-shell = "2.4.0"
url = "2"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
