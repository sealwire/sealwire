[workspace]
members = [
    "crates/relay-api",
    "crates/relay-broker",
    "crates/sealwire-private",
    "crates/relay-http",
    "crates/relay-server",
    "crates/relay-util",
]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Elastic-2.0"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.10"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
ed25519-dalek = "2"
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
ipnet = "2"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# Maintained successor to xsalsa20poly1305; move to stable 0.2 once published.
crypto_secretbox = "0.2.0-pre.0"
